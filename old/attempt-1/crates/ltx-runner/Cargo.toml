[package]
name = "ltx-runner"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "ltx-runner"
path = "src/main.rs"

[dependencies]
ltx-core = { path = "../ltx-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "1"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "io-util", "fs", "time"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
