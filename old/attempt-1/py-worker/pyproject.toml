[project]
name = "tiny-ltx-generator-worker"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "ltx-pipelines",
  "torch>=2.7",
  "transformers>=4.52,<5",
  "safetensors",
  "pillow",
  "imageio[ffmpeg]",
  "huggingface_hub",
  "pytest",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ltx_worker*"]
